services:
  - type: web
    name: carebridge-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: ./backend
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
